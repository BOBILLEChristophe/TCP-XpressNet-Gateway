[platformio]
default_envs = esp32

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
lib_deps =
  olikraus/U8g2
upload_speed = 921600

[env:esp32]
board = esp32dev

[env:esp32-s3]
board = esp32-s3-devkitc-1
