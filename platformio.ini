[platformio]
default_envs = esp32-s3


; ============================================================
; Paramètres communs
; ============================================================

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip

framework = arduino

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -D CORE_DEBUG_LEVEL=0


; ============================================================
; ESP32 classique - ESP32 Dev Module
; ============================================================

[env:esp32]
board = esp32dev

build_flags =
    ${env.build_flags}
    -D BOARD_ESP32


; ============================================================
; ESP32-S3
; ============================================================

[env:esp32-s3]
board = esp32-s3-devkitc-1

build_flags =
    ${env.build_flags}
    -D BOARD_ESP32_S3